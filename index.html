<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12355b">
<link rel="manifest" href="manifest.json">
<title>Work Timer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:720px;margin-inline:auto}
header{background:#12355b;color:white;border-radius:0 0 18px 18px;padding:20px 18px;margin:0 -14px 16px}
h1{margin:0;font-size:28px}.sub{opacity:.8;font-size:14px;margin-top:3px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}
label{font-weight:600;font-size:14px;display:block;margin-bottom:7px}
textarea{width:100%;min-height:72px;border:1px solid #ccd5df;border-radius:10px;padding:12px;font-size:16px;resize:vertical}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}
.start{background:#198754;color:white;width:100%;font-size:20px}.stop{background:#c62828;color:white;width:100%;font-size:20px}
button.secondary{background:#e8eef5;color:#12355b}.row{display:flex;gap:10px}.row>*{flex:1}
.status{font-weight:700;font-size:18px}.clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;margin:6px 0}
.total{font-size:34px;font-weight:800}.muted{color:#657384;font-size:13px}
.entry{border-top:1px solid #e2e7ed;padding:13px 0}.entry:first-child{border-top:0}
.entrytime{font-weight:700}.duration{font-weight:800;color:#12355b}.comment{margin-top:4px}
.empty{text-align:center;color:#718096;padding:20px}
.danger{color:#a61b1b}
</style>
</head>
<body>
<header><h1>Work Timer</h1><div class="sub">Start • Stop • Record • Total</div></header>

<div class="card">
  <label for="comment">What are you working on?</label>
  <textarea id="comment" placeholder="Enter an activity or comment..."></textarea>
  <div style="height:12px"></div>
  <div id="status" class="status">Ready to start</div>
  <div id="live" class="clock">00:00:00</div>
  <button id="action" class="start" onclick="toggleTimer()">START</button>
</div>

<div class="card">
  <div class="muted">TODAY'S CUMULATIVE TIME</div>
  <div id="total" class="total">00:00:00</div>
</div>

<div class="card">
  <div class="row">
    <button class="secondary" onclick="exportCSV()">Export CSV</button>
    <button class="secondary" onclick="clearToday()">Clear Today</button>
  </div>
</div>

<div class="card">
  <h2 style="margin-top:0">Today's Records</h2>
  <div id="records"></div>
</div>

<script>
const KEY='workTimerRecordsV1';
const ACTIVE='workTimerActiveV1';
let timer=null;

function records(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function save(r){localStorage.setItem(KEY,JSON.stringify(r))}
function active(){return JSON.parse(localStorage.getItem(ACTIVE)||'null')}
function fmt(ms){
  ms=Math.max(0,ms); let s=Math.floor(ms/1000), h=Math.floor(s/3600); s%=3600;
  let m=Math.floor(s/60); s%=60;
  return [h,m,s].map((x,i)=>String(x).padStart(2,'0')).join(':');
}
function dateKey(ts){return new Date(ts).toLocaleDateString('en-CA')}
function today(){return dateKey(Date.now())}

function toggleTimer(){
 const a=active();
 if(!a){
   const comment=document.getElementById('comment').value.trim();
   const start=Date.now();
   localStorage.setItem(ACTIVE,JSON.stringify({start,comment}));
   render(); tick();
 }else{
   const stop=Date.now();
   const r=records();
   r.unshift({start:a.start,stop,comment:a.comment,duration:stop-a.start});
   save(r);localStorage.removeItem(ACTIVE);document.getElementById('comment').value='';
   render();
 }
}
function tick(){
 if(timer)clearInterval(timer);
 if(active()) timer=setInterval(render,500);
}
function render(){
 const a=active(), now=Date.now();
 const action=document.getElementById('action');
 if(a){
   document.getElementById('status').textContent='Timer running';
   document.getElementById('live').textContent=fmt(now-a.start);
   action.textContent='STOP';action.className='stop';
 }else{
   document.getElementById('status').textContent='Ready to start';
   document.getElementById('live').textContent='00:00:00';
   action.textContent='START';action.className='start';
 }
 const rs=records().filter(x=>dateKey(x.start)===today());
 let total=rs.reduce((n,x)=>n+x.duration,0);
 if(a && dateKey(a.start)===today()) total+=now-a.start;
 document.getElementById('total').textContent=fmt(total);
 const box=document.getElementById('records');
 if(!rs.length){box.innerHTML='<div class="empty">No completed records yet today.</div>';return}
 box.innerHTML=rs.map(x=>`
   <div class="entry">
    <div class="entrytime">${new Date(x.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
      – ${new Date(x.stop).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
      <span class="duration">(${fmt(x.duration)})</span></div>
    <div class="comment">${escapeHtml(x.comment||'No comment')}</div>
   </div>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportCSV(){
 const rs=records().filter(x=>dateKey(x.start)===today());
 if(!rs.length){alert('There are no completed records to export today.');return}
 let csv='Date,Start,Stop,Duration,Comment\\n';
 rs.slice().reverse().forEach(x=>{
   const d=new Date(x.start).toLocaleDateString();
   const st=new Date(x.start).toLocaleTimeString();
   const sp=new Date(x.stop).toLocaleTimeString();
   csv += [d,st,sp,fmt(x.duration),`"${(x.comment||'').replaceAll('"','""')}"`].join(',')+'\\n';
 });
 const blob=new Blob([csv],{type:'text/csv'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='work-timer-'+today()+'.csv';a.click();URL.revokeObjectURL(url);
}
function clearToday(){
 if(confirm("Clear all completed records for today? This cannot be undone.")){
   save(records().filter(x=>dateKey(x.start)!==today()));render();
 }
}
render();tick();
</script>
</body>
</html>
